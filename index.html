<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Responsibilities</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-width editable matrix, one row per task, one column per entity, owners as colored chips. */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --fg:#1b1d2e; --muted:#6b6f85; --line:#e4e6ef; --hover:#f0f2fa;
  --head-bg:#14152b; --head-fg:#ffffff; --accent:#2f4bd8; --accent-fg:#ffffff; --danger:#c0283d;
  --pink-bg:#fde2e8; --pink-fg:#b4234a;
  --green-bg:#dff3e4; --green-fg:#1f7a3a;
  --blue-bg:#dcebfb; --blue-fg:#1b5fa8;
  --purple-bg:#f0defa; --purple-fg:#7b2fa3;
  --orange-bg:#fdebd2; --orange-fg:#a85400;
  --teal-bg:#d8f1f0; --teal-fg:#0f7a76;
  --yellow-bg:#fff3bf; --yellow-fg:#7d5b00;
  --gray-bg:#ececf2; --gray-fg:#565a70;
  --indigo-bg:#e0e4fb; --indigo-fg:#3a45b5;
  --red-bg:#fbdcd8; --red-fg:#b3261e;
  --lime-bg:#e8f2c9; --lime-fg:#4d6a0a;
  --slate-bg:#dfe5ea; --slate-fg:#3d5063;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1019; --surface:#171826; --fg:#e8e9f3; --muted:#9a9eb5; --line:#2a2c40; --hover:#1f2135;
  --head-bg:#0a0b14; --head-fg:#e8e9f3; --accent:#7f93ff; --accent-fg:#0f1019; --danger:#ff7a8c;
  --pink-bg:#4a1f2b; --pink-fg:#ff9db6;
  --green-bg:#1d3d28; --green-fg:#8fdca4;
  --blue-bg:#1c3552; --blue-fg:#8dbcf0;
  --purple-bg:#38204a; --purple-fg:#d6a6f2;
  --orange-bg:#4a3216; --orange-fg:#f5c07a;
  --teal-bg:#17403f; --teal-fg:#7fd8d3;
  --yellow-bg:#4a3d12; --yellow-fg:#f2d46b;
  --gray-bg:#2c2e3c; --gray-fg:#b5b8c8;
  --indigo-bg:#262b58; --indigo-fg:#a9b3ff;
  --red-bg:#4d211e; --red-fg:#ff9f98;
  --lime-bg:#34401a; --lime-fg:#c3dd7a;
  --slate-bg:#27323d; --slate-fg:#aebccb;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1019; --surface:#171826; --fg:#e8e9f3; --muted:#9a9eb5; --line:#2a2c40; --hover:#1f2135;
  --head-bg:#0a0b14; --head-fg:#e8e9f3; --accent:#7f93ff; --accent-fg:#0f1019; --danger:#ff7a8c;
  --pink-bg:#4a1f2b; --pink-fg:#ff9db6;
  --green-bg:#1d3d28; --green-fg:#8fdca4;
  --blue-bg:#1c3552; --blue-fg:#8dbcf0;
  --purple-bg:#38204a; --purple-fg:#d6a6f2;
  --orange-bg:#4a3216; --orange-fg:#f5c07a;
  --teal-bg:#17403f; --teal-fg:#7fd8d3;
  --yellow-bg:#4a3d12; --yellow-fg:#f2d46b;
  --gray-bg:#2c2e3c; --gray-fg:#b5b8c8;
  --indigo-bg:#262b58; --indigo-fg:#a9b3ff;
  --red-bg:#4d211e; --red-fg:#ff9f98;
  --lime-bg:#34401a; --lime-fg:#c3dd7a;
  --slate-bg:#27323d; --slate-fg:#aebccb;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.4;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:12px;margin-top:2px;display:flex;gap:10px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:5px}
.dot.ok{background:#2fa05a}.dot.busy{background:#d99a1c}.dot.bad{background:var(--danger)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:12px;font-size:12px;color:var(--muted)}
.filters label{display:flex;align-items:center;gap:6px}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:5px 8px;color:var(--fg);min-width:0}
.filters input{width:210px;max-width:100%}

.wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:auto;height:max(360px,min(680px,calc(100vh - 200px)));overscroll-behavior:contain;scrollbar-width:auto;scrollbar-color:var(--muted) var(--hover)}
.wrap::-webkit-scrollbar{height:14px;width:14px}
.wrap::-webkit-scrollbar-track{background:var(--hover)}
.wrap::-webkit-scrollbar-thumb{background:var(--muted);border-radius:7px;border:3px solid var(--hover)}
.wrap::-webkit-scrollbar-corner{background:var(--hover)}
table{border-collapse:collapse;width:100%;min-width:1320px;table-layout:fixed}
thead th{position:sticky;top:0;z-index:2;background:var(--head-bg);color:var(--head-fg);text-align:left;font-size:11px;font-weight:600;padding:11px 8px;letter-spacing:.04em}
tbody td{padding:5px 8px;border-top:1px solid var(--line);vertical-align:middle;height:34px}
tbody tr:hover{background:var(--hover)}
col.c-grip{width:30px}col.c-freq{width:108px}col.c-task{width:230px}col.c-note{width:230px}col.c-del{width:44px}

.grip{cursor:grab;color:var(--muted);text-align:center;user-select:none;font-size:14px;letter-spacing:-2px}
.grip:active{cursor:grabbing}
tr.dragging{opacity:.4}
tr.drop-before td{box-shadow:inset 0 2px 0 var(--accent)}
tr.drop-after td{box-shadow:inset 0 -2px 0 var(--accent)}

.chip{display:inline-block;border:0;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:500;cursor:pointer;
  background:var(--gray-bg);color:var(--gray-fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.chip.empty{background:transparent;border:1px dashed var(--line);color:transparent;min-width:26px;height:19px;padding:0}
.chip.empty:hover{border-color:var(--muted)}
.t-pink{background:var(--pink-bg);color:var(--pink-fg)}
.t-green{background:var(--green-bg);color:var(--green-fg)}
.t-blue{background:var(--blue-bg);color:var(--blue-fg)}
.t-purple{background:var(--purple-bg);color:var(--purple-fg)}
.t-orange{background:var(--orange-bg);color:var(--orange-fg)}
.t-teal{background:var(--teal-bg);color:var(--teal-fg)}
.t-yellow{background:var(--yellow-bg);color:var(--yellow-fg)}
.t-indigo{background:var(--indigo-bg);color:var(--indigo-fg)}
.t-red{background:var(--red-bg);color:var(--red-fg)}
.t-lime{background:var(--lime-bg);color:var(--lime-fg)}
.t-slate{background:var(--slate-bg);color:var(--slate-fg)}
select.freq{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:500;cursor:pointer;text-align:center}
select.freq option{background:var(--surface);color:var(--fg)}
.task{width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:4px 6px;margin-left:-6px;width:calc(100% + 6px)}
.note{color:var(--muted)}
.task:hover{border-color:var(--line)}
.task:focus{border-color:var(--accent);background:var(--surface)}
.cell-edit{width:100%;border:1px solid var(--accent);border-radius:999px;background:var(--surface);padding:2px 10px;font-size:11px}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:4px;padding:3px 6px;font-size:14px;line-height:1}
.del:hover{color:var(--danger);background:var(--hover)}
.del.confirm{color:var(--danger);font-size:11px;font-weight:600;border:1px solid var(--danger)}
body.ro .grip,body.ro .del{display:none}
body.ro .chip,body.ro select.freq{cursor:default}

.state{padding:36px 16px;text-align:center;color:var(--muted)}
.state strong{display:block;color:var(--fg);font-size:14px;margin-bottom:4px}
.foot{margin-top:10px;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);
  padding:8px 14px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s;max-width:90vw}
.toast.show{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.sheet-box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;width:min(640px,100%);display:flex;flex-direction:column;gap:10px}
.sheet-box textarea{width:100%;height:220px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px ui-monospace,Menlo,monospace}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head><body>

<div class="top">
  <div>
    <h1>Daily / Weekly Team Activities</h1>
    <div class="sub"><span><span class="dot" id="dot"></span><span id="status">Connecting…</span></span><span id="count"></span></div>
  </div>
  <div class="actions">
    <button class="btn primary" id="add" type="button" disabled>+ Add row</button>
    <button class="btn" id="csv" type="button">Export CSV</button>
    <button class="btn" id="html" type="button">Copy HTML</button>
  </div>
</div>

<div class="filters">
  <label for="freq">Frequency
    <select id="freq"><option>All</option><option>Daily</option><option>Weekly</option><option>Bi-Weekly</option><option>Monthly</option><option>As Received</option></select>
  </label>
  <label for="q">Search
    <input id="q" type="search" placeholder="Task or owner…" autocomplete="off">
  </label>
</div>

<div class="wrap" tabindex="0" aria-label="Task table, scrollable">
  <table>
    <colgroup><col class="c-grip"><col class="c-freq"><col class="c-task"><col><col><col><col><col><col><col class="c-note"><col class="c-del"></colgroup>
    <thead><tr><th></th><th>Frequency</th><th>Task</th><th>PRC</th><th>NAR</th><th>HRC</th><th>PCI</th><th>CIP</th><th>FTS</th><th>Notes</th><th></th></tr></thead>
    <tbody id="body"></tbody>
  </table>
  <div class="state" id="state" hidden></div>
</div>
<p class="foot" id="foot">Click an owner to change it, drag the dots to reorder. Scroll right for FTS and Notes. Changes save for everyone automatically.</p>
<datalist id="names"></datalist>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
var ENT=['PRC','NAR','HRC','PCI','CIP','FTS'];
var FREQ=['Daily','Weekly','Bi-Weekly','Monthly','As Received'];
var FREQ_TONE={Daily:'green',Weekly:'blue','Bi-Weekly':'teal',Monthly:'orange','As Received':'yellow'};
var NAME_TONE={rosa:'pink',grace:'green',jordan:'blue',kryssa:'purple',sophya:'orange',doreen:'teal',rachel:'yellow',conor:'indigo',samantha:'red',glenn:'lime',shafie:'slate'};

var col=null, rows=[], canWrite=true, downloads=null;
var pendingFocus=null, dirtyWhileEditing=false, dragId=null;
var $=function(id){return document.getElementById(id)};
var body=$('body'), stateEl=$('state');

function h(tag,props){
  var el=document.createElement(tag);
  for(var k in (props||{})){
    if(k==='class')el.className=props[k];
    else if(k==='text')el.textContent=props[k];
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),props[k]);
    else if(props[k]===true)el.setAttribute(k,'');
    else if(props[k]!==false&&props[k]!=null)el.setAttribute(k,props[k]);
  }
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c!=null)el.appendChild(typeof c==='string'?document.createTextNode(c):c)}
  return el;
}
function toast(msg){
  var t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2400);
}
function setStatus(kind,text){$('dot').className='dot '+kind;$('status').textContent=text}

/* ---------- writes ---------- */
function write(fn){
  if(!canWrite)return Promise.resolve();
  setStatus('busy','Saving…');
  return fn().then(function(){setStatus('ok','Saved in this browser')},function(e){
    if(e&&e.code==='invalid_argument'){setReadOnly('You can view this list but not edit it.')}
    else{setStatus('bad','Not saved');toast('This browser blocked saving. Use Export CSV to keep a copy.')}
  });
}
function setReadOnly(msg){
  canWrite=false;document.body.classList.add('ro');$('add').disabled=true;
  setStatus('bad','View only');$('foot').textContent=msg;render();
}
function updateRow(id,patch){return write(function(){return col.doc(id).update(patch)})}

/* ---------- helpers ---------- */
function toneFor(name){return NAME_TONE[String(name).trim().toLowerCase()]||null}
function visibleRows(){
  var f=$('freq').value,q=$('q').value.trim().toLowerCase();
  return rows.filter(function(r){
    if(f!=='All'&&r.freq!==f)return false;
    if(!q)return true;
    if((r.task||'').toLowerCase().indexOf(q)>-1||(r.note||'').toLowerCase().indexOf(q)>-1)return true;
    return ENT.some(function(e){return String(r.owners[e]||'').toLowerCase().indexOf(q)>-1});
  });
}
function editing(){var a=document.activeElement;return a&&body.contains(a)&&(a.tagName==='INPUT')}

/* ---------- render ---------- */
function ownerCell(r,ent){
  var td=h('td');var v=r.owners[ent]||'';
  var tone=v&&toneFor(v);
  var chip=h('button',{type:'button',class:'chip'+(v?'':' empty')+(tone?' t-'+tone:''),text:v||'+','aria-label':ent+' owner'+(v?': '+v:': none'),
    onclick:function(){if(canWrite)startEdit(td,r,ent,v)}});
  td.appendChild(chip);return td;
}
function startEdit(td,r,ent,v){
  var input=h('input',{class:'cell-edit',type:'text',list:'names',value:v,'aria-label':ent+' owner'});
  var done=false;
  function finish(commit){
    if(done)return;done=true;
    var nv=input.value.trim();
    if(commit&&nv!==v){updateRow(r.id,{owners:(function(o){o[ent]=nv;return o})({})})}
    render();
  }
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();finish(true)}
    else if(e.key==='Escape'){e.preventDefault();finish(false)}
  });
  input.addEventListener('blur',function(){finish(true)});
  td.textContent='';td.appendChild(input);input.focus();input.select();
}
function rowEl(r){
  var tr=h('tr',{'data-id':r.id});
  var grip=h('td',{class:'grip',title:'Drag to reorder','aria-hidden':'true',text:'⋮⋮'});
  grip.addEventListener('mousedown',function(){tr.draggable=true});
  grip.addEventListener('mouseup',function(){tr.draggable=false});
  tr.addEventListener('dragstart',function(e){
    if(!tr.draggable){e.preventDefault();return}
    dragId=r.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',r.id);
    setTimeout(function(){tr.classList.add('dragging')},0);
  });
  tr.addEventListener('dragend',function(){tr.draggable=false;dragId=null;clearMarks();tr.classList.remove('dragging')});
  tr.appendChild(grip);

  var sel=h('select',{class:'freq t-'+(FREQ_TONE[r.freq]||'gray'),'aria-label':'Frequency',disabled:!canWrite,
    onchange:function(){updateRow(r.id,{freq:sel.value})}});
  FREQ.forEach(function(f){sel.appendChild(h('option',{value:f,text:f,selected:f===r.freq}))});
  tr.appendChild(h('td',null,sel));

  var inp=h('input',{class:'task',type:'text',value:r.task||'',placeholder:'New task','aria-label':'Task',readonly:!canWrite,
    onchange:function(){updateRow(r.id,{task:inp.value.trim()})},
    onkeydown:function(e){if(e.key==='Enter')inp.blur()}});
  tr.appendChild(h('td',null,inp));

  ENT.forEach(function(e){tr.appendChild(ownerCell(r,e))});

  var note=h('input',{class:'task note',type:'text',value:r.note||'',placeholder:canWrite?'Add a note':'','aria-label':'Notes',readonly:!canWrite,
    onchange:function(){updateRow(r.id,{note:note.value.trim()})},
    onkeydown:function(e){if(e.key==='Enter')note.blur()}});
  tr.appendChild(h('td',null,note));

  var del=h('button',{type:'button',class:'del',title:'Delete row','aria-label':'Delete row',text:'×'});
  del.addEventListener('click',function(){
    if(del.classList.contains('confirm')){
      write(function(){return col.doc(r.id).delete()});
    }else{
      del.classList.add('confirm');del.textContent='Delete?';
      setTimeout(function(){if(del.isConnected){del.classList.remove('confirm');del.textContent='×'}},3000);
    }
  });
  tr.appendChild(h('td',null,del));
  return tr;
}
function render(){
  if(editing()){dirtyWhileEditing=true;return}
  dirtyWhileEditing=false;
  var vis=visibleRows();
  body.textContent='';
  vis.forEach(function(r){body.appendChild(rowEl(r))});
  // owner name suggestions
  var seen={};Object.keys(NAME_TONE).forEach(function(n){seen[n[0].toUpperCase()+n.slice(1)]=1});
  rows.forEach(function(r){ENT.forEach(function(e){if(r.owners[e])seen[r.owners[e]]=1})});
  var dl=$('names');dl.textContent='';Object.keys(seen).sort().forEach(function(n){dl.appendChild(h('option',{value:n}))});
  $('count').textContent=vis.length===rows.length?rows.length+' tasks':vis.length+' of '+rows.length+' tasks';
  if(!rows.length){
    stateEl.hidden=false;stateEl.textContent='';
    stateEl.appendChild(h('strong',{text:'No tasks yet'}));
    stateEl.appendChild(document.createTextNode(canWrite?'Use “+ Add row” to enter the first one.':'Nothing has been added to this list.'));
  }else if(!vis.length){
    stateEl.hidden=false;stateEl.textContent='';
    stateEl.appendChild(h('strong',{text:'No matches'}));
    stateEl.appendChild(document.createTextNode('Change the frequency or search to see more rows.'));
  }else stateEl.hidden=true;
  if(pendingFocus){
    var t=body.querySelector('tr[data-id="'+pendingFocus+'"] .task');
    if(t){t.focus();pendingFocus=null}
  }
}
body.addEventListener('focusout',function(){
  setTimeout(function(){if(dirtyWhileEditing&&!editing())render()},0);
});

/* ---------- drag to reorder ---------- */
function clearMarks(){body.querySelectorAll('.drop-before,.drop-after').forEach(function(t){t.classList.remove('drop-before','drop-after')})}
body.addEventListener('dragover',function(e){
  if(!dragId)return;
  var tr=e.target.closest('tr[data-id]');if(!tr)return;
  e.preventDefault();clearMarks();
  var rect=tr.getBoundingClientRect();
  tr.classList.add(e.clientY<rect.top+rect.height/2?'drop-before':'drop-after');
});
body.addEventListener('drop',function(e){
  if(!dragId)return;
  e.preventDefault();
  var tr=e.target.closest('tr[data-id]');if(!tr){clearMarks();return}
  var before=tr.classList.contains('drop-before');
  var targetId=tr.getAttribute('data-id');
  clearMarks();
  var movedId=dragId;dragId=null;
  if(targetId===movedId)return;
  var list=visibleRows().filter(function(r){return r.id!==movedId});
  var idx=list.findIndex(function(r){return r.id===targetId});
  var ins=idx+(before?0:1);
  var prev=list[ins-1],next=list[ins],order;
  if(prev&&next)order=(prev.order+next.order)/2;
  else if(prev)order=prev.order+1;
  else order=next.order-1;
  updateRow(movedId,{order:order});
});

/* ---------- add / filters ---------- */
$('add').addEventListener('click',function(){
  if(!canWrite||!col)return;
  var max=rows.reduce(function(m,r){return Math.max(m,r.order)},0);
  var f=$('freq').value;
  var ref=col.doc();
  pendingFocus=ref.id;
  var data={freq:f==='All'?'Daily':f,task:'',owners:{PRC:'',NAR:'',HRC:'',PCI:'',CIP:'',FTS:''},note:'',order:max+1};
  $('q').value='';
  write(function(){return ref.set(data)});
});
$('freq').addEventListener('change',render);
$('q').addEventListener('input',render);

/* ---------- export ---------- */
function csvText(){
  var q=function(s){s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  var lines=[['Frequency','Task'].concat(ENT,['Notes']).map(q).join(',')];
  rows.forEach(function(r){lines.push([r.freq,r.task].concat(ENT.map(function(e){return r.owners[e]||''}),[r.note||'']).map(q).join(','))});
  return lines.join('\n');
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function htmlText(){
  var out='<table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-family:sans-serif;font-size:13px">\n<thead><tr style="background:#1a1a2e;color:#fff"><th>Frequency</th><th>Task</th>'+ENT.map(function(e){return '<th>'+e+'</th>'}).join('')+'<th>Notes</th></tr></thead>\n<tbody>\n';
  rows.forEach(function(r){

var memory=null,listeners=[],store=null;
function load(){try{var t=localStorage.getItem(KEY);if(t){var a=JSON.parse(t);if(Array.isArray(a))return a}}catch(e){}return memory}
function persist(){memory=store;try{localStorage.setItem(KEY,JSON.stringify(store));return true}catch(e){return false}}
function idx(id){for(var i=0;i<store.length;i++)if(store[i].id===id)return i;return -1}
function snapshot(){
  var docs=store.slice().sort(function(a,b){return a.order-b.order}).map(function(r){return {id:r.id,data:function(){return r}}});
  return {docs:docs};
}
function emit(){var sn=snapshot();listeners.forEach(function(fn){fn(sn)})}
function commit(fn){fn();var ok=persist();emit();return ok?Promise.resolve():Promise.reject({code:'storage'})}
function makeCol(){
  return {
    doc:function(id){
      id=id||('n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
      return {id:id,
        set:function(d){return commit(function(){var rec=Object.assign({id:id},d),i=idx(id);if(i>-1)store[i]=rec;else store.push(rec)})},
        update:function(p){return commit(function(){var r=store[idx(id)];if(!r)return;for(var k in p){if(k==='owners')r.owners=Object.assign({},r.owners,p.owners);else r[k]=p[k]}})},
        delete:function(){return commit(function(){var i=idx(id);if(i>-1)store.splice(i,1)})}};
    },
    orderBy:function(){return {onSnapshot:function(next){listeners.push(next);next(snapshot())}}}
  };
}

        setTimeout(function(){URL.revokeObjectURL(url);a.remove()},500);res({status:'saved'});
      }catch(e){rej(e)}
    });
  }};

  col.orderBy('order').onSnapshot(function(snap){
    rows=snap.docs.map(fromDoc).sort(function(a,b){return a.order-b.order});
    setStatus('ok','Saved in this browser');
    render();
  });
}
